---
name: Build
permissions:
  contents: read

on:
  push:
    # Build every branch push. Listing only tags-ignore would make GitHub skip
    # branch pushes entirely, so branches must be named too.
    branches:
      - '**'
    # Publishing moves the latest-build tag, and a versioned release (v0.1.0)
    # tags a commit main has already built; neither push should start a build.
    tags-ignore:
      - latest-build
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  # Let every main build finish so each pushed commit gets a Deck Flatpak.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-input-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test SDL controller motion rates
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 tests/input/test_gamepad_motion_rate.py

  # The Steam Controller (2026) driver suite natively on Linux under ASan/UBSan: the manager's
  # enumeration policies are exercised for both platforms' HID layouts, and the suite does not
  # depend on the Windows job, where an earlier test step can fail first.
  test-steam-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Test the Steam Controller (2026) driver (Linux, ASan/UBSan)
        run: |
          g++ -std=c++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DMOONLIGHT_STEAMCONTROLLER_TEST \
            -Itests/steamcontroller/support -Iapp -Imoonlight-common-c/moonlight-common-c/src \
            tests/steamcontroller/tst_steamcontroller.cpp \
            app/streaming/input/steamcontroller/steamcontrollerattributes.cpp \
            app/streaming/input/steamcontroller/steamcontrollercore.cpp \
            app/streaming/input/steamcontroller/steamcontrollerlink.cpp \
            app/streaming/input/steamcontroller/steamcontrollerhost.cpp \
            -pthread -o build-tst_steamcontroller
          ./build-tst_steamcontroller

  # !ink's own suites: the adaptive bitrate policy and the Apollo host rules
  # (launch verb and replies, permissions, clipboard sync, quick menu, updater versions).
  test-ink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev
      - name: Test the adaptive bitrate policy and the Apollo host rules
        run: |
          for suite in streaming/bitratepolicy:tst_bitratepolicy apollo/apollo:tst_apollo; do
            pro=${suite%%:*}; bin=${suite##*:}
            mkdir -p "build-$bin"
            (cd "build-$bin" && qmake6 "../tests/$pro.pro" && make -j"$(nproc)" && QT_QPA_PLATFORM=offscreen "./$bin")
          done

  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          echo "ci_version=$(cat app/version.txt)-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_OUTPUT}"

  build-flatpak:
    needs: setup
    uses: ./.github/workflows/build-flatpak.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      source_ref: ${{ github.sha }}

  # Publish every main build as the "Latest Steam Deck build" release, with a
  # fixed file name, so it can be downloaded on the Deck without a GitHub login:
  # https://github.com/oaa20203-source/deckvoid/releases/latest/download/ink-x86_64.flatpak
  # (GitHub drops the "!" from asset names, so the file is ink-, not !ink-.)
  publish-deck-build:
    needs: [setup, build-flatpak, test-ink]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the release notes list the commits since the previous build
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: ink-Flatpak-${{ needs.setup.outputs.ci_version }}
      - name: Update the latest-build release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_VERSION: ${{ needs.setup.outputs.ci_version }}
        run: |
          set -euo pipefail
          cp "ink-$CI_VERSION-x86_64.flatpak" ink-x86_64.flatpak
          # Builds up to 39a701e6 look for the old file name when they self-update
          cp ink-x86_64.flatpak DeckVoid-x86_64.flatpak

          # The commit the previous build was made from: where the latest-build tag points
          previous=$(gh api "repos/$GH_REPO/git/ref/tags/latest-build" -q .object.sha 2>/dev/null || true)
          if [[ -n "$previous" ]] && git cat-file -e "$previous^{commit}" 2>/dev/null && [[ "$previous" != "$GITHUB_SHA" ]]; then
            changes=$(git log --no-merges --format='- %s (%h)' "$previous..$GITHUB_SHA")
            heading="## Changes since build ${previous:0:7}"
          else
            changes=$(git log --no-merges --format='- %s (%h)' -n 20 "$GITHUB_SHA")
            heading="## Latest changes"
          fi
          [[ -n "$changes" ]] || changes="- (no new commits)"
          notes=$(printf '%s\n\n%s\n\n%s\n%s\n' \
            "Steam Deck build $CI_VERSION from commit ${GITHUB_SHA}. !ink installs this build itself through its in-app updater; to install by hand see https://github.com/${GH_REPO}#install-on-steam-deck" \
            "$heading" \
            "$changes" \
            "Full history: https://github.com/${GH_REPO}/commits/${GITHUB_SHA}")

          if gh release view latest-build >/dev/null 2>&1; then
            # Move the tag to this commit so the release matches the file
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest-build --title "Latest Steam Deck build ($CI_VERSION)" --notes "$notes" --latest
          else
            gh release create latest-build --target "$GITHUB_SHA" --title "Latest Steam Deck build ($CI_VERSION)" --notes "$notes" --latest
          fi
          gh release upload latest-build ink-x86_64.flatpak DeckVoid-x86_64.flatpak --clobber
