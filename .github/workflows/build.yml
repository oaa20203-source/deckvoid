---
name: Build
permissions:
  contents: read

on:
  push:
    # Build every branch push. Listing only tags-ignore would make GitHub skip
    # branch pushes entirely, so branches must be named too.
    branches:
      - '**'
    # Publishing moves the latest-build tag; that push must not start another build.
    tags-ignore:
      - latest-build
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  # Let every main build finish so each pushed commit gets a Deck Flatpak.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-input-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test SDL controller motion rates
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 tests/input/test_gamepad_motion_rate.py

  # The Steam Controller (2026) driver suite natively on Linux under ASan/UBSan: the manager's
  # enumeration policies are exercised for both platforms' HID layouts, and the suite does not
  # depend on the Windows job, where an earlier test step can fail first.
  test-steam-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Test the Steam Controller (2026) driver (Linux, ASan/UBSan)
        run: |
          g++ -std=c++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DMOONLIGHT_STEAMCONTROLLER_TEST \
            -Itests/steamcontroller/support -Iapp -Imoonlight-common-c/moonlight-common-c/src \
            tests/steamcontroller/tst_steamcontroller.cpp \
            app/streaming/input/steamcontroller/steamcontrollerattributes.cpp \
            app/streaming/input/steamcontroller/steamcontrollercore.cpp \
            app/streaming/input/steamcontroller/steamcontrollerlink.cpp \
            app/streaming/input/steamcontroller/steamcontrollerhost.cpp \
            -pthread -o build-tst_steamcontroller
          ./build-tst_steamcontroller

  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          echo "ci_version=$(cat app/version.txt)-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_OUTPUT}"

  build-flatpak:
    needs: setup
    uses: ./.github/workflows/build-flatpak.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      source_ref: ${{ github.sha }}

  # Publish every main build as the "Latest Steam Deck build" release, with a
  # fixed file name, so it can be downloaded on the Deck without a GitHub login:
  # https://github.com/oaa20203-source/deckvoid/releases/latest/download/DeckVoid-x86_64.flatpak
  publish-deck-build:
    needs: [setup, build-flatpak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: DeckVoid-Flatpak-${{ needs.setup.outputs.ci_version }}
      - name: Update the latest-build release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_VERSION: ${{ needs.setup.outputs.ci_version }}
        run: |
          cp "DeckVoid-$CI_VERSION-x86_64.flatpak" DeckVoid-x86_64.flatpak
          notes="Steam Deck build $CI_VERSION from commit ${GITHUB_SHA}. Install instructions: https://github.com/${GH_REPO}#install-on-steam-deck"
          if gh release view latest-build >/dev/null 2>&1; then
            # Move the tag to this commit so the release matches the file
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest-build --title "Latest Steam Deck build ($CI_VERSION)" --notes "$notes" --latest
          else
            gh release create latest-build --target "$GITHUB_SHA" --title "Latest Steam Deck build ($CI_VERSION)" --notes "$notes" --latest
          fi
          gh release upload latest-build DeckVoid-x86_64.flatpak --clobber
