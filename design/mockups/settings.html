<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>!ink settings mockup</title>
<style>
  :root { --border: #d8d2c8; --font-sans: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; --text-secondary: #5A4E45; }
  body { margin: 0; padding: 16px; background: #e4dfd7; font-family: var(--font-sans); }
  #wrap { max-width: 1180px; margin: 0 auto; }
</style>
</head>
<body>
<div id="wrap">
<!-- widget body starts -->
<style>
#win{background:#fff;color:#2A2420;border-radius:12px;border:0.5px solid var(--border);aspect-ratio:16/10;overflow:hidden;position:relative;container-type:inline-size;font-family:var(--font-sans)}
#win .lights{position:absolute;left:1.8cqw;top:1.7cqw;width:1.3cqw;height:1.3cqw;border-radius:50%;background:#E6DFD4;box-shadow:2.2cqw 0 0 #E6DFD4,4.4cqw 0 0 #E6DFD4}
#side{position:absolute;left:1.8cqw;top:4.4cqw;bottom:1.8cqw;width:21.1cqw;display:flex;flex-direction:column}
#side .hd{background:#2A2420;color:#fff;border-radius:1.5cqw;padding:1cqw 1.5cqw;font-size:13px;font-size:1.9cqw}
#side .in{padding:0 1.5cqw;display:flex;flex-direction:column;flex:1}
#cats{margin-top:1.2cqw}
#side .cat{font-size:13px;font-size:1.9cqw;padding:.8cqw 0;color:#8A7D70;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#side .cat.on{color:#2A2420;font-weight:500}
#side .cat.on:after{content:"";width:.9cqw;height:.9cqw;border-radius:50%;background:#F78A1F}
#main{position:absolute;left:24.3%;right:1.8cqw;top:4.4cqw;bottom:1.8cqw;display:grid;gap:1.4cqw;grid-template-rows:12.5cqw 1fr}
#pn{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;min-height:0}
#win .t{border-radius:2.2cqw;position:relative;overflow:hidden;background:#EFE6D2}
#win .t canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#win .p{border-radius:2.2cqw;background:#FAF8F5;padding:1.5cqw 2.1cqw;box-sizing:border-box;min-height:0;overflow:hidden}
#win .x{position:absolute;left:2.2cqw;bottom:1.6cqw;right:1cqw;z-index:1}
#win .s{font-size:11px;font-size:1.6cqw;display:block}
#win .h{font-weight:500;font-size:26px;font-size:3.9cqw;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
#win .pt{font-size:11px;font-size:1.6cqw;color:#8A7D70;padding-bottom:.5cqw}
#win .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-size:1.6cqw;padding:.95cqw 0;border-top:0.5px solid #EEEAE4;white-space:nowrap;min-height:2.6cqw}
#win .sg{white-space:nowrap;display:inline-flex;background:#fff;border:0.5px solid #E6DFD4;border-radius:99px;padding:.3cqw}
#win .sg span{padding:.45cqw 1cqw;border-radius:99px;color:#8A7D70;cursor:pointer;text-align:center}
#win .sg span.on{background:#2A2420;color:#fff}
#win .sg.w{display:flex;width:fit-content;margin:.1cqw 0 1.3cqw;font-size:11px;font-size:1.6cqw}
#win .sg.w span{flex:none}
#win .fd{background:#fff;border:0.5px solid #E6DFD4;border-radius:99px;padding:.75cqw 1.3cqw}
#win .tg{width:3.2cqw;height:1.8cqw;border-radius:99px;background:#E6DFD4;position:relative;display:inline-block;cursor:pointer}
#win .tg:after{content:"";position:absolute;top:.25cqw;left:.25cqw;width:1.3cqw;height:1.3cqw;border-radius:50%;background:#fff}
#win .tg.on{background:#2A2420}
#win .tg.on:after{left:auto;right:.25cqw}
#win .sl{height:.5cqw;border-radius:99px;background:#EEEAE4;position:relative;margin:.3cqw 0 1.3cqw}
#win .sl i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#F78A1F,#7FAA8C)}
#win .sl i:after{content:"";position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,#878787,#C3C3C3);opacity:0;transition:opacity .5s}
#win.asleep .sl i:after{opacity:1}
#win .sl b{position:absolute;top:50%;width:1.7cqw;height:1.7cqw;margin:-.85cqw 0 0 -.85cqw;border-radius:50%;background:#fff;border:.24cqw solid #2A2420;box-sizing:border-box}
</style>
<div id="win">
  <div class="lights"></div>
  <div id="side">
    <div class="hd">!ink</div>
    <div class="in">
      <div id="cats"></div>
      <div style="margin-top:auto;color:#8A7D70;padding-bottom:.6cqw;font-size:13px;font-size:1.9cqw">&larr;&nbsp; Home</div>
    </div>
  </div>
  <div id="main">
    <div class="t"><canvas id="g1"></canvas>
      <div class="x"><span class="s">Settings</span><span class="h" id="ttl">Picture</span></div>
    </div>
    <div id="pn"></div>
  </div>
</div>
<div style="display:flex;gap:8px;margin-top:14px"><button id="b1">PC ready</button><button id="b2">PC asleep</button></div>
<script>
(function(){
// Rows: ['tog',label,on] | ['seg',label,options,active,wide] | ['sld',label,value,percent] | ['fd',label,value]
var D={
'Picture':[['Stream',[['seg','Resolution',['1080p','1440p','Native','Custom'],2,1],['seg','Frame rate',['60','90','120'],2],['sld','Bitrate','55 Mbps',55],['tog','Adaptive bitrate',1],['seg','Video codec',['Auto','H.264','HEVC','AV1'],2,1]]],
           ['Display',[['seg','Display mode',['Full screen','Borderless','Windowed'],0,1],['tog','V-Sync',1],['tog','Frame pacing',0],['tog','VRR',0],['tog','HDR',0],['tog','YUV 4:4:4',0]]]],
'Audio':[['Output',[['seg','Speaker layout',['Stereo','5.1 surround','7.1 surround'],0,1]]],
         ['Muting',[['tog','Mute PC speakers while streaming',1],['tog','Mute when in the background',0]]]],
'Input':[['Mouse',[['tog','Desktop mouse mode',0],['tog','Swap left and right buttons',0],['tog','Reverse scroll direction',0],['tog','Touchscreen as trackpad',1]]],
         ['Keyboard',[['seg','Capture system shortcuts',['Off','In full screen','Always'],1,1]]]],
'Controllers':[['Gamepad',[['tog','Swap A/B and X/Y',0],['tog','Keep controller 1 connected',0],['tog','Hold Start to control the mouse',1],['tog','Use controller in the background',0]]],
               ['Steam Controller',[['tog','Drive Steam Controller directly',1],['tog','Gyro and accelerometer',1],['tog','Trackpads as touchpad halves',0],['tog','Stretch sticks to the rim',0],['seg','Grip buttons',['Paddles','DualShock','Off'],0,1]]]],
'Haptics':[['Rumble',[['seg','Hold host rumble for',['0.25 s','0.5 s','1 s','2 s','Max'],1,1]]],
           ['Steam Controller over Bluetooth',[['seg','Pad click boost',['Off','+6 dB','+12 dB','+20 dB'],0,1],['seg','Pad slide pulse length',['100%','150%','200%','300%'],0,1],['seg','Haptic gain',['Off','+6 dB','+12 dB'],0,1]]]],
'Host':[['Session',[['tog','Optimise game settings',1],['tog','Quit app when the stream ends',0],['fd','Client name','MacBook Pro']]],
        ['Apollo',[['seg','Display for launches',['Host decides','Virtual','Physical'],0,1],['seg','Virtual display scale',['100%','125%','150%','More'],0,1],['seg','Clipboard sync',['Off','Manual','Automatic'],2,1]]]],
'App':[['Window',[['seg','Language',['English','More'],0],['seg','Window mode',['Windowed','Maximised','Full screen'],0,1],['tog','Keep display awake while streaming',1]]],
       ['Notices',[['tog','Connection quality warnings',1],['tog','Configuration warnings',1],['tog','Hide VRR buffer limit warnings',0],['tog','Discord Rich Presence',0],['tog','Notify me about prerelease builds',0]]]],
'Advanced':[['Decoding and network',[['seg','Video decoder',['Auto','Software','Hardware'],0,1],['seg','Renderer',['Auto','More'],0],['tog','Unlock bitrate limit',0],['tog','Find PCs on this network',1],['tog','Detect blocked connections',1]]],
            ['Overlay and VRR',[['tog','Performance stats while streaming',0],['tog','Frametime graph while streaming',0],['tog','Reduce judder',0],['tog','Absorb microstutter',0],['tog','Trace VRR frames',0],['fd','Diagnostics folder','Open']]]]};
function row(r){var t=r[0],l=r[1];
  if(t==='tog')return '<div class="row"><span>'+l+'</span><span class="tg'+(r[2]?' on':'')+'"></span></div>';
  if(t==='sld')return '<div class="row" style="padding-bottom:.5cqw"><span>'+l+'</span><span>'+r[2]+'</span></div><div class="sl"><i style="width:'+r[3]+'%"></i><b style="left:'+r[3]+'%"></b></div>';
  if(t==='fd')return '<div class="row" style="padding:1.3cqw 0"><span>'+l+'</span><span class="fd">'+r[2]+'</span></div>';
  var s=r[2].map(function(o,i){return '<span'+(i===r[3]?' class="on"':'')+'>'+o+'</span>';}).join('');
  return r[4]?'<div class="row" style="padding-bottom:.6cqw"><span>'+l+'</span></div><div class="sg w">'+s+'</div>'
             :'<div class="row" style="padding:1.3cqw 0"><span>'+l+'</span><span class="sg">'+s+'</span></div>';}
var win=document.getElementById('win'),cats=document.getElementById('cats'),pn=document.getElementById('pn'),ttl=document.getElementById('ttl');
function show(name){ttl.textContent=name;
  cats.innerHTML=Object.keys(D).map(function(k){return '<div class="cat'+(k===name?' on':'')+'">'+k+'</div>';}).join('');
  [].forEach.call(cats.children,function(c){c.onclick=function(){show(c.textContent);};});
  pn.innerHTML=D[name].map(function(p){return '<div class="p"><div class="pt">'+p[0]+'</div>'+p[1].map(row).join('')+'</div>';}).join('');
  [].forEach.call(pn.querySelectorAll('.sg'),function(e){var k=[].slice.call(e.children);k.forEach(function(s){s.onclick=function(){k.forEach(function(o){o.className='';});s.className='on';};});});
  [].forEach.call(pn.querySelectorAll('.tg'),function(e){e.onclick=function(){e.classList.toggle('on');};});}
window.__show=show;window.__cats=Object.keys(D);show('Picture');

// Glass, drawn at the screen's full pixel density. The flutes keep the same soft light-to-shadow
// profile as before, but each is a whole number of screen pixels wide and is smoothed per pixel,
// so every flute lands identically instead of blurring across half pixels.
var dpr=Math.min(window.devicePixelRatio||1,3),PAL=[[247,138,31],[127,170,140],[60,140,175],[240,194,74]],GREY=[135,195,70,220],BASE=[239,230,210],BASEGREY=242,SPEED=62,mix=0,target=0;
function rgb(c,g){return [0,1,2].map(function(j){return Math.round(c[j]+(g-c[j])*mix);}).join(',');}
function flutes(P){var s=document.createElement('canvas');s.width=P;s.height=1;var c=s.getContext('2d'),m=c.createImageData(P,1),N=8;
  for(var i=0;i<P;i++){var R=0,G=0,Bl=0,A=0;
    for(var k=0;k<N;k++){var u=(i+(k+.5)/N)/P,w,d;
      if(u<.45){w=.5*(1-u/.45);d=0;}else if(u<.91){w=0;d=.12*(u-.45)/.46;}else{var q=(u-.91)/.09;w=.5*q;d=.12*(1-q);}
      var dk=d*(1-w);R+=255*w+40*dk;G+=255*w+50*dk;Bl+=255*w+40*dk;A+=w+dk;}
    var j=i*4;m.data[j]=A?R/A:0;m.data[j+1]=A?G/A:0;m.data[j+2]=A?Bl/A:0;m.data[j+3]=A/N*255;}
  c.putImageData(m,0,0);return s;}
function glass(id,blobs,seed){var c=document.getElementById(id);return {c:c,x:c.getContext('2d'),b:blobs,s:seed,P:0,pat:null};}
function draw(g,t){var c=g.c,w=Math.round(c.clientWidth*dpr),h=Math.round(c.clientHeight*dpr);if(!w||!h)return;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h;g.P=0;}
  var x=g.x;x.fillStyle='rgb('+rgb(BASE,BASEGREY)+')';x.fillRect(0,0,w,h);
  for(var i=0;i<g.b.length;i++){var b=g.b[i],k=rgb(PAL[b[0]],GREY[b[0]]),
      cx=(b[1]+.16*Math.sin(t*(.23+.05*i)+g.s+i*1.7))*w,cy=(b[2]+.30*Math.cos(t*(.19+.04*i)+g.s*1.3+i*2.1))*h,
      gr=x.createRadialGradient(cx,cy,0,cx,cy,b[3]*w);
    gr.addColorStop(0,'rgba('+k+',1)');gr.addColorStop(.38,'rgba('+k+',.9)');gr.addColorStop(1,'rgba('+k+',0)');x.fillStyle=gr;x.fillRect(0,0,w,h);}
  var P=Math.max(4,Math.round(win.clientWidth*.016*dpr));
  if(P!==g.P){g.pat=x.createPattern(flutes(P),'repeat');g.P=P;}
  x.fillStyle=g.pat;x.fillRect(0,0,w,h);}
var G=[glass('g1',[[0,.22,.75,.42],[1,.78,.30,.40],[2,.02,.10,.20],[3,.55,.95,.22],[0,.95,.90,.26]],0)],T=0,last=0;
function loop(ms){var dt=(ms-last)/1000;last=ms;if(dt>.1)dt=.016;T+=dt*SPEED/25;mix+=(target-mix)*Math.min(1,dt*4);for(var i=0;i<G.length;i++)draw(G[i],T);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
// PC off: the glass and the slider go grey; the orange dot beside the current category stays
function state(asleep){target=asleep?1:0;win.className=asleep?'asleep':'';}
document.getElementById('b1').onclick=function(){state(false);};document.getElementById('b2').onclick=function(){state(true);};
})();
</script>
<!-- widget body ends -->
</div>
</body>
</html>
